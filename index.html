  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, Fragment } = React;

    // ============================================================
    //  Supabase設定
    // ============================================================
    const SUPABASE_URL  = "https://bgpevzoncxampykakurt.supabase.co";
    const SUPABASE_KEY  = "sb_publishable_bSCxwc0Vwazjy0RYiMlfRA_kWwpA6Ne";
    // ============================================================

    const _sbReady = SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_KEY !== "YOUR_SUPABASE_ANON_KEY";
    const db = _sbReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const AXIS_CONFIG = {
      asset:         { label: "資産",     min: 20, max: 100 },
      competence:    { label: "能力",     min: 0,  max: 100 },
      relationships: { label: "人間関係", min: 0,  max: 60 },
      luck:          { label: "運",       min: 10, max: 40 },
      mind:          { label: "起業精神", min: 0,  max: 80 },
    };
    const RADAR_KEYS = ["asset", "competence", "relationships", "luck", "mind"];
    const JP_LABEL = { asset: "資産", competence: "能力", relationships: "人間関係", luck: "運", mind: "起業精神" };
    const normalize = (v, min, max) => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));

    // グレード（戦略には触れず、等級のみ）
    const GRADES = {
      S: { letter: "S", title: "富道マスター", color: "#FFB800", light: "#FFD96B", shadow: "rgba(255,184,0,0.35)" },
      A: { letter: "A", title: "達人",       color: "#9B5DE5", light: "#C99BFF", shadow: "rgba(155,93,229,0.35)" },
      B: { letter: "B", title: "努力家",     color: "#4EA8FF", light: "#92CBFF", shadow: "rgba(78,168,255,0.35)" },
      C: { letter: "C", title: "成長株",     color: "#38D996", light: "#82E9BE", shadow: "rgba(56,217,150,0.35)" },
      D: { letter: "D", title: "修行中",     color: "#FF8FB1", light: "#FFB8D0", shadow: "rgba(255,143,177,0.35)" },
    };
    function calcGrade(scores) {
      const pcts = RADAR_KEYS.map(k => normalize(scores[k], AXIS_CONFIG[k].min, AXIS_CONFIG[k].max));
      const avg = pcts.reduce((a, b) => a + b, 0) / pcts.length;
      let g;
      if (avg >= 80) g = GRADES.S;
      else if (avg >= 65) g = GRADES.A;
      else if (avg >= 50) g = GRADES.B;
      else if (avg >= 35) g = GRADES.C;
      else g = GRADES.D;
      return { ...g, avg };
    }

    // 対人関係アンケートの結果（タイプ判定）
    function surveyScoreOf(survey) {
      return (Number(survey.q1||0)+Number(survey.q2||0)+Number(survey.q3||0)+Number(survey.q4||0)+(6-Number(survey.q5||0)))/5;
    }
    const REL_TYPES = [
      { min: 4.1, label: "人間関係 重視タイプ", desc: "人とのつながりを何より大切にする人。" },
      { min: 3.1, label: "バランス・協調タイプ", desc: "人間関係を大事にしつつ、自分の時間も保てる人。" },
      { min: 2.1, label: "マイペース・自立タイプ", desc: "人も大事だが、自分の世界も同じくらい大切にする人。" },
      { min: 0,   label: "自己完結タイプ", desc: "自分の目標や興味に集中して力を発揮する人。" },
    ];
    const relTypeOf = (ss) => REL_TYPES.find(t => ss >= t.min);

    // アドバイス（五角形チャートの形から。50字以内）
    function chartAdvice(scores) {
      const arr = RADAR_KEYS.map(k => ({ k, pct: normalize(scores[k], AXIS_CONFIG[k].min, AXIS_CONFIG[k].max) }));
      const sorted = [...arr].sort((a, b) => b.pct - a.pct);
      const best = sorted[0], worst = sorted[sorted.length - 1];
      if (best.pct - worst.pct < 8) return "5つの力がバランス良く整っています。理想的な五角形です。";
      if (worst.k === "relationships") return "人とのつながりを意識すると、五角形がさらに整います。";
      return `「${JP_LABEL[worst.k]}」が伸びると、五角形のバランスが良くなります。`;
    }

    function GradeMedallion({ grade }) {
      const { letter, color, light } = grade;
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const s = canvas.width;
        const ctx = canvas.getContext("2d");
        const cx = s / 2, cy = s / 2;
        ctx.clearRect(0, 0, s, s);
        // 放射線
        for (let i = 0; i < 36; i++) {
          const a = (i * 10) * Math.PI / 180;
          const long = i % 3 === 0;
          const r1 = s * 0.36, r2 = s * (long ? 0.465 : 0.418);
          ctx.beginPath();
          ctx.moveTo(cx + r1*Math.cos(a), cy + r1*Math.sin(a));
          ctx.lineTo(cx + r2*Math.cos(a), cy + r2*Math.sin(a));
          ctx.strokeStyle = color + "48";
          ctx.lineWidth = long ? 2.5 : 1.2;
          ctx.lineCap = "round";
          ctx.stroke();
        }
        // 月桂樹
        [-1, 1].forEach(dir => {
          for (let i = 0; i < 5; i++) {
            const lx = cx + dir * (s*0.127 + i*s*0.055);
            const ly = cy + s*0.273 - i*s*0.064;
            const angle = (dir < 0 ? 35 + i*8 : -35 - i*8) * Math.PI / 180;
            ctx.save();
            ctx.translate(lx, ly);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, s*0.036, s*0.015, 0, 0, Math.PI*2);
            ctx.fillStyle = color + Math.round((0.5 - i*0.04)*255).toString(16).padStart(2,"0");
            ctx.fill();
            ctx.restore();
          }
        });
        // 外縁円
        ctx.beginPath();
        ctx.arc(cx, cy, s*0.345, 0, Math.PI*2);
        ctx.strokeStyle = color + "5a";
        ctx.lineWidth = 1.8;
        ctx.stroke();
        // ビーズ
        for (let i = 0; i < 40; i++) {
          const a = (i * 9) * Math.PI / 180;
          ctx.beginPath();
          ctx.arc(cx + s*0.318*Math.cos(a), cy + s*0.318*Math.sin(a), 1.7, 0, Math.PI*2);
          ctx.fillStyle = color + "72";
          ctx.fill();
        }
        // メインサークル（グラデーション）
        const grad = ctx.createLinearGradient(cx, cy - s*0.28, cx, cy + s*0.28);
        grad.addColorStop(0, light);
        grad.addColorStop(1, color);
        ctx.beginPath();
        ctx.arc(cx, cy, s*0.282, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();
        // 光沢
        const shine = ctx.createRadialGradient(cx, cy - s*0.08, 0, cx, cy, s*0.28);
        shine.addColorStop(0, "rgba(255,255,255,0.55)");
        shine.addColorStop(0.5, "rgba(255,255,255,0.1)");
        shine.addColorStop(1, "rgba(255,255,255,0)");
        ctx.beginPath();
        ctx.arc(cx, cy, s*0.282, 0, Math.PI*2);
        ctx.fillStyle = shine;
        ctx.fill();
        // 内縁
        ctx.beginPath();
        ctx.arc(cx, cy, s*0.241, 0, Math.PI*2);
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.lineWidth = 1.8;
        ctx.stroke();
        // グレード文字
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = `800 ${Math.round(s*0.27)}px 'JetBrains Mono', monospace`;
        ctx.fillText(letter, cx, cy + 2);
      }, [letter, color, light]);
      return <canvas ref={canvasRef} width={220} height={220} className="medallion" style={{ width: 170, height: 170 }} />;

    function calcScores({ finalAsset, knowledge, green, red, blue, evSt, survey }) {
      let adj = { a: 0, c: 0, r: 0, l: 0, m: 0 };
      for (const ev of EVENTS) {
        const st = evSt[ev.id];
        if (!st || !st.sel) continue;
        if (ev.act && !st.done) continue;
        if (ev.sp === "fraud") {
          const amt = Number(st.prevAmt || 0);
          adj.m += ev.m; adj.c += amt * 5;
          if (!st.fullPrev) { adj.c += ev.c; adj.l += ev.l; }
          continue;
        }
        if (ev.sp === "disaster") {
          const mul = st.insured ? -1 : 1;
          adj.a += ev.a * mul; adj.l += ev.l * mul; adj.m += ev.m * mul;
          continue;
        }
        adj.a += ev.a; adj.c += ev.c; adj.r += ev.r; adj.l += ev.l; adj.m += ev.m;
      }
      const sq = surveyScoreOf(survey);
      const asset = Number(finalAsset||0) + adj.a;
      const competence = Number(knowledge||0) * 15 + adj.c;
      const relationships = sq * 10 + adj.r;
      const luck = asset/4 + relationships/3 + adj.l;
      const mind = Number(green||0)*5 + Number(red||0)*10 + Number(blue||0)*15 + adj.m;
      return { asset, competence, relationships, luck, mind };
    }

                <div className="card">
                  <div className="ct">ゲームの数値</div>
                  <label className="lbl">ゲーム終了時の資産額</label>
                  <input className="inp" type="number" inputMode="numeric" value={fp.finalAsset} onChange={(e) => upFp("finalAsset", e.target.value)} placeholder="例：100" />
                  <label className="lbl">知識カードの枚数</label>
                  <input className="inp" type="number" inputMode="numeric" min="0" value={fp.knowledge} onChange={(e) => upFp("knowledge", e.target.value)} placeholder="例：3" />
                </div>
                <div className="card">
                  <div className="ct">起業カードの枚数</div>
                  <div className="r3">
                    {[["green","#38D996","緑"],["red","#FF5CA8","赤"],["blue","#4EA8FF","青"]].map(([k,col,lbl]) => (
                      <div key={k} className="sc2">
                        <div style={{ fontSize: 13, marginBottom: 8, fontWeight: 800 }}>
                          <span style={{ display: "inline-block", width: 11, height: 11, borderRadius: "50%", background: col, marginRight: 5, verticalAlign: "middle" }} />
                          <span style={{ color: col }}>{lbl}</span>
                        </div>
                        <input className="inp" type="number" inputMode="numeric" min="0" value={fp[k]} onChange={(e) => upFp(k, e.target.value)} placeholder="0" style={{ textAlign: "center", padding: "10px 4px", fontSize: 20, fontWeight: 800 }} />
                      </div>
                    ))}
                  </div>
                </div>
                <button className="btn" onClick={() => setPh(2)} disabled={!canP1}>次へ進む →</button>
              </Fragment>
            )}

            {ph === 2 && (
              <Fragment>
                <button className="bk" onClick={() => setPh(1)}>← 戻る</button>
                <div className="ph-ttl">イベントカードを選ぶ</div>
                <div className="ph-sub">ゲーム中に引いたカードをすべて選んでください（複数選択可）</div>
                <div className="evgrid">
                  {EVENTS.map((ev) => {
                    const st = evSt[ev.id] || {};
                    return (
                      <div key={ev.id} className={`evc${st.sel ? " sel" : ""}`} onClick={() => togEv(ev.id)}>
                        <div className="evn">{ev.name}</div>
                        {st.sel && (ev.act || ev.sp) && (
                          <div className="det" onClick={(e) => e.stopPropagation()}>
                            {ev.act && (<Fragment>
                              <div className="dq">実際に行いましたか？</div>
                              <div className="rbg">{[[true,"はい"],[false,"いいえ"]].map(([v,l]) => (<button key={l} className={`rb${st.done === v ? " on" : ""}`} onClick={() => updEv(ev.id, "done", v)}>{l}</button>))}</div>
                            </Fragment>)}
                            {ev.sp === "disaster" && (<div style={{ marginTop: ev.act ? 10 : 0 }}>
                              <div className="dq">保険カードで回避できましたか？</div>
                              <div className="rbg">{[[true,"はい"],[false,"いいえ"]].map(([v,l]) => (<button key={l} className={`rb${st.insured === v ? " on" : ""}`} onClick={() => updEv(ev.id, "insured", v)}>{l}</button>))}</div>
                            </div>)}
                            {ev.sp === "fraud" && (<Fragment>
                              <div className="dq">知識カードで完全に防げましたか？</div>
                              <div className="rbg">{[[true,"防げた"],[false,"防げなかった"]].map(([v,l]) => (<button key={l} className={`rb${st.fullPrev === v ? " on" : ""}`} onClick={() => updEv(ev.id, "fullPrev", v)}>{l}</button>))}</div>
                              <div className="dq" style={{ marginTop: 8 }}>知識で防いだ金額（任意）</div>
                              <input className="smli" type="number" inputMode="numeric" min="0" value={st.prevAmt || ""} onChange={(e) => updEv(ev.id, "prevAmt", e.target.value)} placeholder="0" onClick={(e) => e.stopPropagation()} />
                            </Fragment>)}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                <button className="btn" onClick={() => setPh(3)}>次へ進む →</button>
              </Fragment>
            )}

            {ph === 3 && (
              <Fragment>
                <button className="bk" onClick={() => setPh(2)}>← 戻る</button>
                <div className="ph-ttl">アンケート</div>
                <div className="ph-sub">普段のあなたについて、1（あてはまらない）〜5（あてはまる）で答えてください</div>
                {SURVEY.map((q, i) => (
                  <div key={q.id} className="card">
                    <div className="qn">質問 {i + 1}</div>
                    <div className="qt">{q.text}</div>
                    <div className="lk">{[1,2,3,4,5].map((v) => (<button key={v} className={`lkb${survey[q.id] === v ? " on" : ""}`} onClick={() => setSurvey(p => ({ ...p, [q.id]: v }))}>{v}</button>))}</div>
                    <div className="lkll"><span>あてはまらない</span><span>あてはまる</span></div>
                  </div>
                ))}
                <button className="btn" onClick={() => setPh(4)} disabled={!canP3}>スコアを計算する</button>
              </Fragment>
            )}

            {ph === 4 && scores && grade && (
              <ResultScreen fp={fp} scores={scores} grade={grade} survey={survey} gameDate={gameDate} onReset={reset} />
            )}
          </div>

          <div className="admin-link"><a href="admin.html">管理者ページ →</a></div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
